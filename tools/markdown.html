
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Previewer</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body{
    font-family:Arial;
    padding:20px;
}

.container{
    display:flex;
    gap:20px;
}

textarea{
    width:50%;
    height:400px;
    padding:10px;
}

#preview{
    width:50%;
    background:#f4f4f4;
    padding:15px;
    border-radius:10px;
}
</style>
</head>
<body>

<h1>📝 Markdown Previewer</h1>

<div class="container">

<textarea id="markdownInput">
# Hello Developer

**Bold Text**

- HTML
- CSS
- JavaScript
</textarea>

<div id="preview"></div>

</div>

<script>

const input =
document.getElementById("markdownInput");

const preview =
document.getElementById("preview");

function updatePreview(){

    preview.innerHTML =
    marked.parse(input.value);
}

input.addEventListener(
    "input",
    updatePreview
);

updatePreview();

</script>

</body>
</html>
