<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Palette Generator</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    padding:40px;
}

#colorBox{
    width:250px;
    height:250px;
    margin:20px auto;
    border-radius:12px;
    border:2px solid #ddd;
}

button{
    padding:10px 20px;
}

h2{
    margin-top:20px;
}
</style>
</head>
<body>

<h1>🎨 Color Palette Generator</h1>

<div id="colorBox"></div>

<h2 id="colorCode">#FFFFFF</h2>

<button onclick="generateColor()">
Generate Color
</button>

<script>
function generateColor(){

    const color =
    "#" + Math.floor(
        Math.random()*16777215
    ).toString(16).padStart(6,"0");

    document.getElementById("colorBox")
    .style.background = color;

    document.getElementById("colorCode")
    .innerText = color;
}

generateColor();
</script>

</body>
</html>
